<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Contact Manager{% endblock %}</title>
    <style>
        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f5f5f5;
            --text-primary: #333333;
            --text-secondary: #666666;
            --border-color: #dddddd;
            --input-bg: #ffffff;
            --input-border: #dddddd;
            --error-bg: #fee;
            --error-text: #c33;
            --success-bg: #efe;
            --success-text: #3c3;
            --navbar-bg: rgba(0, 0, 0, 0.8);
            --sidebar-bg: rgba(0, 0, 0, 0.9);
            --ribbon-bg: rgba(0, 0, 0, 0.95);
            --table-hover: #fafafa;
        }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --bg-primary: #1e1e1e;
                --bg-secondary: #2d2d2d;
                --text-primary: #e0e0e0;
                --text-secondary: #b0b0b0;
                --border-color: #404040;
                --input-bg: #2d2d2d;
                --input-border: #404040;
                --error-bg: #3a1515;
                --error-text: #ff6b6b;
                --success-bg: #153a15;
                --success-text: #5cff5c;
                --navbar-bg: rgba(20, 20, 20, 0.95);
                --sidebar-bg: rgba(15, 15, 15, 0.98);
                --ribbon-bg: rgba(10, 10, 10, 0.99);
                --table-hover: #2a2a2a;
            }
        }

        [data-theme="dark"] {
            --bg-primary: #1e1e1e;
            --bg-secondary: #2d2d2d;
            --text-primary: #e0e0e0;
            --text-secondary: #b0b0b0;
            --border-color: #404040;
            --input-bg: #2d2d2d;
            --input-border: #404040;
            --error-bg: #3a1515;
            --error-text: #ff6b6b;
            --success-bg: #153a15;
            --success-text: #5cff5c;
            --navbar-bg: rgba(20, 20, 20, 0.95);
            --sidebar-bg: rgba(15, 15, 15, 0.98);
            --ribbon-bg: rgba(10, 10, 10, 0.99);
            --table-hover: #2a2a2a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            transition: background 0.3s;
            display: grid;
            grid-template-columns: 250px 1fr;
            grid-template-rows: 1fr;
        }

        body[data-theme="dark"] {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        }

        /* Login page layout (no sidebar) */
        body.login-page {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Sidebar */
        #app-sidebar {
            background: var(--sidebar-bg);
            color: white;
            display: flex;
            flex-direction: column;
            height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
            width: 250px;
            z-index: 1000;
            overflow-y: auto;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
        }

        #app-sidebar.collapsed {
            width: 70px;
        }

        .sidebar-header {
            background: var(--ribbon-bg);
            padding: 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        .sidebar-header h1 {
            font-size: 1.2rem;
            margin: 0 0 0.5rem 0;
            width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .sidebar-header .ribbon-controls {
            display: flex;
            gap: 0.5rem;
            width: 100%;
            justify-content: flex-end;
        }

        .theme-toggle {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 0.4rem 0.8rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.3s, border-color 0.3s;
            font-weight: 600;
        }

        .theme-toggle:hover {
            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.5);
        }

        .sidebar-header a {
            color: white;
            text-decoration: none;
            padding: 0.4rem 0.8rem;
            border-radius: 4px;
            transition: background 0.3s;
            font-size: 0.9rem;
        }

        .sidebar-header a:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .collapse-toggle {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            cursor: pointer;
            padding: 0.4rem;
            border-radius: 4px;
            font-size: 1rem;
            transition: background 0.3s;
        }

        .collapse-toggle:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .sidebar-content {
            flex: 1;
            padding: 1rem 0;
            overflow-y: auto;
        }

        .sidebar-app {
            padding: 0.75rem 1rem;
            cursor: pointer;
            transition: background 0.3s;
            color: rgba(255, 255, 255, 0.8);
            border-left: 3px solid transparent;
        }

        .sidebar-app:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .sidebar-app.active {
            background: rgba(102, 126, 234, 0.3);
            border-left-color: #667eea;
            color: white;
            font-weight: 600;
        }

        .sidebar-app a {
            color: inherit;
            text-decoration: none;
            display: block;
        }

        /* Main content area */
        #app-main-area {
            margin-left: 250px;
            display: grid;
            grid-template-rows: 1fr auto;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        #app-main-area.sidebar-collapsed {
            margin-left: 70px;
        }

        #app-content {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            overflow-y: auto;
        }

        /* Status line */
        #app-status-line {
            background: var(--navbar-bg);
            color: white;
            padding: 0.75rem 2rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
        }

        .container {
            background: var(--bg-primary);
            border-radius: 8px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 2rem;
            width: 90%;
            max-width: 800px;
            color: var(--text-primary);
            transition: background 0.3s, color 0.3s;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--text-primary);
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="tel"] {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--input-border);
            border-radius: 4px;
            font-size: 1rem;
            background: var(--input-bg);
            color: var(--text-primary);
            transition: border-color 0.3s, background 0.3s, color 0.3s;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="password"]:focus,
        input[type="tel"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .error {
            background: var(--error-bg);
            color: var(--error-text);
            padding: 1rem;
            border-radius: 4px;
            margin-bottom: 1rem;
            border-left: 4px solid var(--error-text);
            transition: background 0.3s, color 0.3s;
        }

        .success {
            background: var(--success-bg);
            color: var(--success-text);
            padding: 1rem;
            border-radius: 4px;
            margin-bottom: 1rem;
            border-left: 4px solid var(--success-text);
            transition: background 0.3s, color 0.3s;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }

        th, td {
            padding: 0.75rem;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-primary);
        }

        th {
            background: var(--bg-secondary);
            font-weight: 600;
        }

        tr:hover {
            background: var(--table-hover);
        }

        .actions {
            display: flex;
            gap: 0.5rem;
        }

        .btn-small {
            padding: 0.4rem 0.8rem;
            font-size: 0.85rem;
        }

        .btn-danger {
            background: #e74c3c;
        }

        .btn-danger:hover {
            background: #c0392b;
        }

        .btn-secondary {
            background: #95a5a6;
        }

        .btn-secondary:hover {
            background: #7f8c8d;
        }

        .dashboard-wide {
            max-width: 1000px;
        }

        hr {
            border: none;
            border-top: 1px solid var(--border-color);
            margin: 2rem 0;
        }

        p {
            color: var(--text-secondary);
        }

        /* Mobile responsive */
        @media (max-width: 768px) {
            body {
                grid-template-columns: 70px 1fr;
            }

            #app-sidebar {
                width: 70px;
            }

            .sidebar-header h1 {
                display: none;
            }

            #app-main-area {
                margin-left: 70px;
            }
        }
    </style>
    <script>
        function initTheme() {
            const savedTheme = localStorage.getItem('theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const theme = savedTheme || (prefersDark ? 'dark' : 'light');

            if (theme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
            } else {
                document.documentElement.removeAttribute('data-theme');
            }
        }

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';

            if (newTheme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
            } else {
                document.documentElement.removeAttribute('data-theme');
            }

            localStorage.setItem('theme', newTheme);
            updateThemeButtonText();
        }

        function updateThemeButtonText() {
            const button = document.getElementById('theme-toggle-btn');
            if (button) {
                const currentTheme = document.documentElement.getAttribute('data-theme');
                button.textContent = currentTheme === 'dark' ? '☀️ Light' : '🌙 Dark';
            }
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('app-sidebar');
            const mainArea = document.getElementById('app-main-area');
            sidebar.classList.toggle('collapsed');
            mainArea.classList.toggle('sidebar-collapsed');
            localStorage.setItem('sidebar-collapsed', sidebar.classList.contains('collapsed'));
        }

        document.addEventListener('DOMContentLoaded', function() {
            updateThemeButtonText();
            const isCollapsed = localStorage.getItem('sidebar-collapsed') === 'true';
            if (isCollapsed) {
                const sidebar = document.getElementById('app-sidebar');
                const mainArea = document.getElementById('app-main-area');
                sidebar.classList.add('collapsed');
                mainArea.classList.add('sidebar-collapsed');
            }
        });

        initTheme();
    </script>
</head>
<body>
    {% block content %}{% endblock %}
</body>
</html>
