{% extends 'base.html' %}

{% block title %}Add Contact - Contact Manager{% endblock %}

{% block content %}
<div class="navbar">
    <h1>Contact Manager</h1>
    <div class="navbar-right">
        <span>{{ session.username }} ({{ session.role.replace('_', ' ').title() }})</span>
        <button class="theme-toggle" id="theme-toggle-btn" onclick="toggleTheme()"></button>
        <a href="{{ url_for('logout') }}">Logout</a>
    </div>
</div>

<div class="container">
    <h2 style="margin-bottom: 1.5rem;">Add New Contact</h2>

    <form method="post">
        <div class="form-group">
            <label for="first_name">First Name</label>
            <input type="text" id="first_name" name="first_name" required>
        </div>

        <div class="form-group">
            <label for="last_name">Last Name</label>
            <input type="text" id="last_name" name="last_name" required>
        </div>

        <div class="form-group">
            <label for="mobile_phone">Mobile Phone</label>
            <input type="tel" id="mobile_phone" name="mobile_phone" placeholder="+1-555-0100" required>
        </div>

        <div style="display: flex; gap: 1rem;">
            <button type="submit" style="flex: 1;">Save Contact</button>
            <a href="{{ url_for('dashboard') }}" style="flex: 1;">
                <button type="button" class="btn-secondary" style="width: 100%;">Cancel</button>
            </a>
        </div>
    </form>
</div>
{% endblock %}
